<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Hill Climb .io</title>
<style>
  body { margin:0; overflow:hidden; background:#87CEEB; }
  canvas { display:block; margin:0 auto; background:#87CEEB; }
  #controls { position:fixed; bottom:20px; width:100%; text-align:center; }
  .btn { font-size:24px; padding:10px 20px; margin:5px; background:#fff; border:1px solid #000; border-radius:10px; }
  #fuelBar { position:fixed; top:20px; left:20px; width:200px; height:20px; border:2px solid #000; background:#ccc; }
  #fuel { height:100%; width:100%; background:#ff4500; }
</style>
</head>
<body>

<canvas id="game"></canvas>
<div id="controls">
  <button class="btn" id="left">⬅️</button>
  <button class="btn" id="up">⬆️</button>
  <button class="btn" id="right">➡️</button>
</div>
<div id="fuelBar"><div id="fuel"></div></div>

<script src="https://yandex.com.tr/gorsel/touch/search?text=hill+climb&img_url=https%3A%2F%2Fwww.gameskinny.com%2Fwp-content%2Fuploads%2Fgameskinnyc%2Fw%2Fx%2Fo%2Fwxo2and-4f1c3.png&pos=35&rpt=simage"></script>
<script>
const { Engine, Render, Runner, World, Bodies, Body, Composite } = Matter;

const canvas = document.getElementById('game');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const engine = Engine.create();
const world = engine.world;

// Renderer sadece physics debug, canvas çizim biz yapacağız
const render = Render.create({
  canvas: canvas,
  engine: engine,
  options: { wireframes:true, background:'#87CEEB', width:canvas.width, height:canvas.height }
});
Render.run(render);
Runner.run(Runner.create(), engine);

// Araba
const carWidth = 80;
const carHeight = 40;
const car = Bodies.rectangle(200, 200, carWidth, carHeight, { friction:0.001, restitution:0.1 });
World.add(world, car);

// Terrain
let terrain = [];
function generateTerrain() {
  let x = 0;
  let lastY = canvas.height - 100;
  for(let i=0;i<50;i++){
    let y = lastY + (Math.random()*80 - 40);
    y = Math.min(canvas.height-50, Math.max(50,y));
    let rect = Bodies.rectangle(x+100, y+((canvas.height-y)/2), 200, canvas.height-y, { isStatic:true, render:{fillStyle:'#228B22'} });
    World.add(world, rect);
    terrain.push(rect);
    lastY = y;
    x += 200;
  }
}
generateTerrain();

// Yakıt sistemi
let fuel = 100;
function updateFuel(amount){
  fuel = Math.max(0, Math.min(100, fuel + amount));
  document.getElementById('fuel').style.width = fuel + '%';
}

// Kontroller
function applyControls(up, left, right){
  if(fuel <=0) return; 
  if(up) { Body.applyForce(car, car.position, {x:0, y:-0.04}); updateFuel(-0.15); }
  if(left) { Body.applyForce(car, car.position, {x:-0.02, y:0}); updateFuel(-0.07); }
  if(right) { Body.applyForce(car, car.position, {x:0.02, y:0}); updateFuel(-0.07); }
}

document.getElementById('up').addEventListener('touchstart',()=>applyControls(true,false,false));
document.getElementById('left').addEventListener('touchstart',()=>applyControls(false,true,false));
document.getElementById('right').addEventListener('touchstart',()=>applyControls(false,false,true));

document.addEventListener('keydown',(e)=>{
  if(e.key==='ArrowUp') applyControls(true,false,false);
  if(e.key==='ArrowLeft') applyControls(false,true,false);
  if(e.key==='ArrowRight') applyControls(false,false,true);
});

// Kamera ve çizim
const carImg = new Image();
carImg.src = 'https://i.imgur.com/8bOHL1l.png'; // basit araba sprite

(function renderLoop(){
  const ctx = canvas.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  
  // Kamera araba etrafında
  ctx.translate(-car.position.x + canvas.width/3,0);

  // Terrain çizimi
  ctx.fillStyle = '#228B22';
  terrain.forEach(t=>{
    ctx.fillRect(t.position.x - 100, t.position.y - (canvas.height-t.position.y)/2, 200, canvas.height-t.position.y);
  });

  // Araba çizimi
  ctx.save();
  ctx.translate(car.position.x, car.position.y);
  ctx.rotate(car.angle);
  ctx.drawImage(carImg, -carWidth/2, -carHeight/2, carWidth, carHeight);
  ctx.restore();

  requestAnimationFrame(renderLoop);
})();
</script>
</body>
</html>
